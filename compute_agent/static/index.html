                    {value && (() => {
                      const plan = activePlan;
                      const isRecommended = plan.plan_id === value.recommended.plan_id;
                      const isApproved = approvedPlanId === plan.plan_id;
                      const margin = num(deadline) - planTime(plan);
                      const budgetShare = num(budget) > 0 ? (planCost(plan) / num(budget)) * 100 : null;
                      const alreadyRun = submitted && executionResult.plan_id === plan.plan_id;
                      const runLabel = execRuntime === null ? "Run this plan" : onSlurm ? "Run on Slurm" : "Run in the simulator";
                      return (
                        <article className="card rec" aria-label="Recommended plan">
                          <div className="rec-top">
                            <div>
                              <div className="eyebrow">{isRecommended ? "Recommended plan" : "Selected plan"}</div>
                              <div className="rec-name">{planName(plan)}</div>
                              <div className="rec-blurb">{planBlurb(plan)}</div>
                              <div className="rec-shape mono">{planShape(plan)}</div>
                            </div>
                            {plan.executable_on_runtime === false ? (
                              <Tag tone="bad">Not runnable on {targetName}</Tag>
                            ) : (
                              <Tag tone="ok">Runs on {targetName}</Tag>
                            )}
                          </div>

                          <div className="metrics">
                            <Metric
                              label="Estimated cost"
                              value={approxEur(plan.estimated_cost_eur)}
                              note={budgetShare === null ? "modelled" : `modelled · ${budgetShare < 1 ? "< 1" : Math.round(budgetShare)}% of budget`}
                              modelled
                            />
                            <Metric label="Time to result" value={`≈ ${mins(plan.total_time_to_result_minutes)}`} note="modelled" modelled />
                            <Metric
                              label={`Deadline · ${mins(deadline)}`}

                              note={margin >= 0 ? `${mins(margin)} to spare` : `late by ${mins(-margin)}`}

                          </div>

                          {isRecommended && value.saved > 0 ? (

                            <div className="value-line neutral">
                              <span className="txt">
                                {value.plans.length === 1

                            <div className="value-line neutral">
                              <span className="txt">
                                {planCost(plan) >= planCost(value.recommended)
                                  ? `${approxEur(planCost(plan) - planCost(value.recommended))} more than the recommended plan`

                                {planTime(plan) < planTime(value.recommended)
                                  ? `, finishing ${mins(planTime(value.recommended) - planTime(plan))} sooner.`
                                  : `, finishing ${mins(planTime(plan) - planTime(value.recommended))} later.`}{" "}
                                <button className="link" onClick={() => setSelectedPlanId(null)}>

                              </span>
                            </div>

                          <div className="actions">
                            {alreadyRun ? (
                              <>
                                <Tag tone="ok">
                                  <Icon name="check" size={13} /> Submitted as job {executionResult.job_id}

                                <button className="btn btn-sm" onClick={startNewRun}>
                                  Start a new run
                                </button>
                              </>

                              <>
                                <button className="btn" disabled>
                                  Advisory mode: nothing will run
                                </button>
                                <button className="link" onClick={() => setShowGovernance(true)}>
                                  Change who decides
                                </button>
                              </>
                            ) : mode === "validation" && !isApproved ? (
                              <>
                                <button
                                  id="approve-plan"
                                  className="btn btn-primary"
                                  onClick={() => handleApprovePlan(plan.plan_id)}
                                  disabled={approvingPlanId === plan.plan_id || plan.executable_on_runtime === false}
                                >
                                  {approvingPlanId === plan.plan_id ? "Recording approval…" : "Approve this plan"}
                                </button>
                                <span className="hint">Nothing runs until you approve.</span>
                              </>
                            ) : (
                              <>
                                <button
                                  id="run-plan"
                                  className="btn btn-accent"
                                  onClick={() => setPendingExecution(plan)}
                                  disabled={executingPlanId === plan.plan_id || plan.executable_on_runtime === false}
                                >
                                  {executingPlanId === plan.plan_id ? "Submitting…" : runLabel}
                                  <Icon name="arrow" size={16} />
                                </button>
                                {isApproved && (
                                  <Tag tone="ok">
                                    <Icon name="check" size={13} /> Approved
                                  </Tag>
                                )}
                                {mode === "delegation" && <span className="hint">Delegated: runs without approval up to {eur(ceiling)}.</span>}
                              </>
                            )}
                          </div>
                          {approvalError && <div className="err">{approvalError}</div>}
                          <div className="basis">
                            {planComparison.cost_basis_detail || "Costs are modelled at a flat vCPU-hour rate."} Times are
                            modelled too: the runtime reports the real ones once the job runs.
                          </div>
                        </article>
                      );
                    })()}

                    {executionResult && (() => {
                      const details = executionResult.submission_details || {};
                      const title = submitted
                        ? executionResult.status === "already_submitted"
                          ? "Already submitted"
                          : `Submitted to ${targetName}`
                        : executionResult.status === "blocked"
                        ? "Blocked by governance"
                        : "Submission failed";
                      return (
                        <article className="card pad" aria-label="Submission result">
                          <div className="card-h">
                            <h2>{title}</h2>
                            <Tag tone={statusTone(executionResult.status)}>{executionResult.status}</Tag>
                          </div>
                          <p className="reason">{executionResult.reason}</p>
                          {submitted && (
                            <dl className="facts">
                              <Fact label="Job id">
                                <span className="mono">{executionResult.job_id || "—"}</span>
                              </Fact>
                              <Fact label="Partition">{details.partition || "—"}</Fact>
                              <Fact label="Machine">
                                {details.machine_type || "—"}
                                {details.cpu ? ` · ${details.cpu} vCPU` : ""}
                              </Fact>
                              <Fact label="Capacity">{details.provisioning_model || "—"}</Fact>
                              <Fact label="Registered by the runtime">
                                {executionResult.verified ? "yes" : "not yet"}
                                {executionResult.verification_details ? (
                                  <span className="cell-sub">{executionResult.verification_details}</span>
                                ) : null}
                              </Fact>
                              <Fact label="Command">
                                <span className="mono">
                                  {Array.isArray(executionResult.safe_argv) ? executionResult.safe_argv.join(" ") : command}
                                </span>
                              </Fact>
                            </dl>
                          )}
                        </article>
                      );
                    })()}

                    {submitted && (
                      <article className="card pad" aria-label="Live run">
                        <div className="card-h">

                          {ourJobVisible ? (
                            <Tag tone={statusTone(liveWl.status)}>{liveWl.status}</Tag>
                          ) : (
                            <Tag tone="warn">waiting for telemetry</Tag>
                          )}
                        </div>
                        {ourJobVisible ? (
                          <div className="metrics" style={{ marginTop: 0 }}>
                            <Metric
                              label="Cost so far"
                              value={eur(liveWl.accrued_cost_eur)}
                              note={costBasisLabel(liveWl.cost_basis)}
                            />
                            <Metric
                              label="Allocation seen"
                              value={liveWl.observed_cpu ? `${liveWl.observed_cpu} vCPU` : "—"}
                              note={[liveWl.observed_machine_type, liveWl.observed_provisioning_mix].filter(Boolean).join(" · ") || "not reported yet"}
                            />
                            <Metric
                              label="Verification"
                              value={String(liveWl.verification_status || "unverified").replace(/_/g, " ")}
                              note={liveWl.verification_detail || ""}
                              tone={liveWl.verification_status === "verified" ? "ok" : liveWl.verification_status === "mismatch" ? "bad" : ""}
                            />
                          </div>
                        ) : (
                          <p className="reason">
                            {runtimeMismatch
                              ? "The status panel shows another runtime, so it cannot describe this job."
                              : `Waiting for ${targetName} to report job ${executionResult.job_id}.`}
                          </p>
                        )}
                        {anomaliesError && <div className="err">{anomaliesError}</div>}
                        {anomalyReport && (() => {
                          const health = HEALTH_COPY[anomalyReport.health_status] || [anomalyReport.health_status, "neutral"];
                          return (
                            <div className="drift">
                              <div className="drift-h">
                                <span className={`dot ${health[1]}`} />
                                {health[0]}
                                <span className="faint mono">{anomalyReport.health_status}</span>
                              </div>
                              {anomalyReport.anomalies.map((a, i) => (
                                <div className="anomaly" key={i}>
                                  <Tag tone={a.severity === "CRITICAL" ? "bad" : "warn"}>{a.severity}</Tag>
                                  <span>{a.title}</span>
                                  <span className="hint">{a.recommended_action}</span>
                                </div>
                              ))}
                              <dl className="facts">
                                <Fact label="Burn rate vs plan">{pct(anomalyReport.telemetry.burn_rate_drift_pct)}</Fact>
                                <Fact label="Projected total">
                                  {approxEur(anomalyReport.telemetry.projected_total_cost_eur)} ·{" "}
                                  {mins(anomalyReport.telemetry.projected_total_duration_minutes)}
                                </Fact>
                                <Fact label="Checkpoint every (Young-Daly)">
                                  {mins(anomalyReport.telemetry.young_daly_optimal_checkpoint_minutes)}
                                </Fact>
                                <Fact label="Work at risk since last checkpoint">
                                  {mins(anomalyReport.telemetry.uncommitted_minutes_at_risk)} ·{" "}
                                  {approxEur(anomalyReport.telemetry.uncommitted_cost_at_risk_eur)}
                                </Fact>
                              </dl>
                            </div>
                          );
                        })()}
                      </article>
                    )}

                    {value && (
                      <div className="card" style={{ paddingTop: 18 }}>
                        <div className="alt-head">
                          <span>All plans · {planComparison.feasible_count} of {planComparison.evaluated_count} shapes fit</span>
                          <span>Cost</span>
                          <span>Time</span>
                          <span />
                        </div>
                        {value.plans.map((plan) => (
                          <button
                            key={plan.plan_id}
                            className={`alt${plan.plan_id === activePlan.plan_id ? " sel" : ""}`}
                            onClick={() => setSelectedPlanId(plan.plan_id)}
                            aria-pressed={plan.plan_id === activePlan.plan_id}
                          >
                            <span>
                              <span className="alt-name">{planName(plan)}</span>
                              <span className="alt-shape mono">{planShape(plan)}</span>
                            </span>
                            <span className="alt-v num">{approxEur(plan.estimated_cost_eur)}</span>
                            <span className="alt-v num">{mins(plan.total_time_to_result_minutes)}</span>
                            <span className="alt-t">
                              {plan.plan_id === value.recommended.plan_id ? (
                                <Tag tone="ok">Recommended</Tag>
                              ) : plan.executable_on_runtime === false ? (
                                <Tag tone="bad">Not runnable</Tag>
                              ) : plan.plan_id === value.fastest.plan_id ? (
                                <Tag>Fastest</Tag>
                              ) : null}
                            </span>
                          </button>
                        ))}
                      </div>
                    )}

                    {value && (() => {
                      const plan = activePlan;
                      const stress = whatIfResult || planComparison.what_if_summary;
                      const scenario = whatIfResult ? "operator scenario" : "default scenario";
                      const params = (stress && stress.parameters) || {};
                      return (
                        <div className="card">
                          <details className="disclose">
                            <summary>
                              <span className="chev">
                                <Icon name="chevron" size={16} />
                              </span>
                              Why this plan
                              <span className="hint">constraints, capacity, what is not verified</span>
                            </summary>
                            <div className="disclose-body">
                              <p className="reason">{plan.ranking_rationale}</p>
                              <ul className="checks">
                                {(plan.satisfied_constraints || []).map((item, i) => (
                                  <li key={i}>
                                    <span className="ic">
                                      <Icon name="check" size={14} />
                                    </span>
                                    {item}
                                  </li>
                                ))}
                              </ul>
                              <dl className="facts">
                                <Fact label="Capacity check">
                                  {plan.capacity_status || "not checked"}
                                  {plan.capacity_detail ? <span className="cell-sub">{plan.capacity_detail}</span> : null}
                                </Fact>
                                <Fact label="Fallback if it fails">
                                  <span title={plan.fallback_plan_id || undefined}>
                                    {planLabelById(value.plans, plan.fallback_plan_id) || "none declared"}
                                  </span>
                                </Fact>
                                <Fact label="Interruption risk">{pct(num(plan.interruption_risk_score) * 100)}</Fact>
                                <Fact label="Carbon (modelled)">
                                  ≈ {num(plan.carbon_emissions_g_co2).toFixed(1)} gCO₂ · {plan.green_tier || "unknown tier"}
                                </Fact>
                              </dl>
                              {Array.isArray(plan.unverified_points) && plan.unverified_points.length > 0 && (
                                <div className="basis">Not verified before the run: {listSentence(plan.unverified_points)}</div>
                              )}
                            </div>
                          </details>
                          <details className="disclose">
                            <summary>
                              <span className="chev">
                                <Icon name="chevron" size={16} />
                              </span>
                              Explore trade-offs
                              <span className="hint">cost, time, interruption risk, carbon</span>
                            </summary>
                            <div className="disclose-body">
                              <div className="sub-h">
                                Pareto frontier
                                <span className="hint">
                                  {planComparison.pareto_frontier
                                    ? `${planComparison.pareto_frontier.pareto_optimal_count} of ${value.plans.length} plans are not beaten on every axis`
                                    : ""}
                                </span>
                              </div>
                              <ParetoScatter
                                plans={planComparison.plans}
                                recommendedId={value.recommended.plan_id}
                                selectedId={activePlan.plan_id}
                                onSelect={setSelectedPlanId}
                              />
                              <div className="sub-h">
                                Stress test
                                <span className="hint">Showing the {scenario}.</span>
                              </div>
                              <div className="sliders">
                                <div className="slider">
                                  <label htmlFor="wi-pre">
                                    Spot preemptions <span className="num">{whatIfPreemptions}</span>
                                  </label>
                                  <input id="wi-pre" type="range" min="0" max="8" step="1" value={whatIfPreemptions} onChange={(e) => setWhatIfPreemptions(Number(e.target.value))} />
                                </div>
                                <div className="slider">
                                  <label htmlFor="wi-budget">
                                    Budget cut <span className="num">{whatIfBudgetShock}%</span>
                                  </label>
                                  <input id="wi-budget" type="range" min="-80" max="0" step="5" value={whatIfBudgetShock} onChange={(e) => setWhatIfBudgetShock(Number(e.target.value))} />
                                </div>
                                <div className="slider">
                                  <label htmlFor="wi-deadline">
                                    Deadline cut <span className="num">{whatIfDeadlineCompression}%</span>
                                  </label>
                                  <input id="wi-deadline" type="range" min="-80" max="0" step="5" value={whatIfDeadlineCompression} onChange={(e) => setWhatIfDeadlineCompression(Number(e.target.value))} />
                                </div>
                              </div>
                              <button className="btn btn-sm" onClick={runWhatIf} disabled={loadingWhatIf}>
                                {loadingWhatIf ? "Running…" : "Run stress test"}
                              </button>
                              {whatIfError && <div className="err">{whatIfError}</div>}
                              {stress && Array.isArray(stress.plan_stress_results) && (
                                <div className="table-wrap" style={{ marginTop: 14 }}>
                                  <table className="t">
                                    <thead>

                        <span>Time to result</span>

                      <div>
                        <span>Approval recorded</span>
                        <span style={{ color: isApproved ? "var(--accent-ink)" : "var(--bad)" }}>{isApproved ? "yes" : "no"}</span>
                      </div>
                      {mode === "delegation" && serverControl && (
                        <div>
                          <span>Delegated ceiling left</span>
                          <span className="num">
                            {eur(serverControl.remaining_delegated_budget_eur)} ({eur(serverControl.committed_cost_eur)} committed)
                          </span>
                        </div>
                      )}
                      <div>
                        <span>Fallback plan</span>
                        <span title={plan.fallback_plan_id || undefined}>
                          {planLabelById(value ? value.plans : [], plan.fallback_plan_id) || "none"}
                        </span>
                      </div>
                    </div>
                    {warnings.length > 0 && (
                      <div className="warns" role="status">
                        <strong>Check before submitting</strong>
                        <ul>
                          {warnings.map((w, i) => (
                            <li key={i}>{w}</li>
                          ))}
                        </ul>
                      </div>
                    )}
                    {Array.isArray(plan.unverified_points) && plan.unverified_points.length > 0 && (
                      <div className="basis" style={{ marginTop: 0 }}>Not verified before the run: {listSentence(plan.unverified_points)}</div>
                    )}
                  </div>
                  <div className="modal-f">
                    <button className="btn" onClick={() => setPendingExecution(null)}>
                      Cancel
                    </button>
                    {!isApproved && mode === "validation" && (
                      <button className="btn" onClick={() => handleApprovePlan(plan.plan_id)} disabled={approvingPlanId === plan.plan_id}>
                        {approvingPlanId === plan.plan_id ? "Recording…" : "Approve first"}
                      </button>
                    )}
                    <button
                      id="confirm-submit"
                      className="btn btn-accent"
                      onClick={() => {
                        setPendingExecution(null);
                        handleExecutePlan(plan);
                      }}
                      disabled={executingPlanId === plan.plan_id}
                    >
                      {executingPlanId === plan.plan_id ? "Submitting…" : "Confirm and submit"}
                    </button>
                  </div>
                </div>
              </div>
            );
          })()}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
