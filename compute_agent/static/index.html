<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AgentGrid · Run batch jobs for less, without missing deadlines</title>
  <meta
    name="description"
    content="AgentGrid prices every way to run a batch job, recommends the cheapest plan that still meets the deadline, submits it only with your approval, then checks on Slurm what actually ran and what it cost."
  />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root {
      --bg: #f7f7f4;
      --surface: #ffffff;
      --surface-2: #f3f3ef;
      --surface-3: #ebebe5;
      --line: #e6e5df;
      --line-2: #d5d4cc;
      --ink: #15171c;
      --ink-2: #4b515b;
      --ink-3: #7d838d;
      --accent: #0f7a5c;
      --accent-ink: #0a5a45;
      --accent-soft: #e4f3eb;
      --warn: #9a5b0b;
      --warn-soft: #fbf0de;
      --bad: #b3261e;
      --bad-soft: #fcebe9;
      --shadow-1: 0 1px 2px rgba(21, 23, 28, 0.04), 0 1px 1px rgba(21, 23, 28, 0.03);
      --shadow-2: 0 1px 2px rgba(21, 23, 28, 0.05), 0 22px 44px -24px rgba(21, 23, 28, 0.28);
      --shadow-3: 0 28px 64px -20px rgba(21, 23, 28, 0.35);
      --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
      --sans: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(1100px 460px at 8% -140px, rgba(15, 122, 92, 0.08), transparent 62%),
        radial-gradient(900px 380px at 100% -160px, rgba(21, 23, 28, 0.05), transparent 60%),
        var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 15px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    button, input { font: inherit; color: inherit; }
    h1, h2, h3, p { margin: 0; }
    .num { font-variant-numeric: tabular-nums; }
    .mono { font-family: var(--mono); font-size: 0.92em; letter-spacing: -0.01em; }
    .muted { color: var(--ink-2); }
    .faint { color: var(--ink-3); }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    /* ---------- top bar ---------- */
    .topbar {
      position: sticky; top: 0; z-index: 30;
      background: rgba(247, 247, 244, 0.82);
      backdrop-filter: saturate(170%) blur(14px);
      -webkit-backdrop-filter: saturate(170%) blur(14px);
      border-bottom: 1px solid var(--line);
    }
    .topbar-inner {
      max-width: 1180px; margin: 0 auto; height: 62px; padding: 0 24px;
      display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px;
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 650; font-size: 16px; letter-spacing: -0.015em; }
    .seg {
      position: relative; display: grid; grid-template-columns: repeat(3, 1fr);
      padding: 3px; border-radius: 999px; background: var(--surface-3); border: 1px solid var(--line);
    }
    .seg-thumb {
      position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc((100% - 6px) / 3);
      border-radius: 999px; background: var(--surface); box-shadow: var(--shadow-1), 0 0 0 1px rgba(21, 23, 28, 0.04);
      transition: transform 0.32s var(--ease);
    }
    .seg button {
      position: relative; z-index: 1; border: 0; background: transparent; cursor: pointer;
      padding: 6px 22px; border-radius: 999px; font-size: 14px; font-weight: 550; color: var(--ink-2);
      transition: color 0.2s;
    }
    .seg button:hover { color: var(--ink); }
    .seg button[aria-selected="true"] { color: var(--ink); }
    .top-right { display: flex; justify-content: flex-end; align-items: center; gap: 8px; }
    .chip {
      display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px;
      border-radius: 999px; border: 1px solid var(--line); background: var(--surface);
      font-size: 13px; font-weight: 550; color: var(--ink-2); white-space: nowrap;
    }
    button.chip { cursor: pointer; transition: border-color 0.15s, background 0.15s; }
    button.chip:hover { border-color: var(--line-2); background: var(--surface-2); }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); flex: none; }
    .dot.ok { background: var(--accent); box-shadow: 0 0 0 3px rgba(15, 122, 92, 0.14); }
    .dot.warn { background: #d08a1c; box-shadow: 0 0 0 3px rgba(208, 138, 28, 0.16); }
    .dot.bad { background: var(--bad); box-shadow: 0 0 0 3px rgba(179, 38, 30, 0.14); }
    .pop-anchor { position: relative; }
    .pop-scrim { position: fixed; inset: 0; z-index: 35; }
    .pop {
      position: absolute; right: 0; top: 42px; z-index: 40; width: 344px; padding: 8px;
      background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow-3);
      animation: rise 0.2s var(--ease);
    }
    .pop-h { padding: 8px 10px 6px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); }
    .mode-opt {
      display: grid; grid-template-columns: 18px 1fr; gap: 10px; width: 100%; text-align: left;
      border: 0; background: transparent; padding: 10px; border-radius: 11px; cursor: pointer;
      transition: background 0.15s;
    }
    .mode-opt:hover { background: var(--surface-2); }
    .mode-opt[aria-checked="true"] { background: var(--surface-2); }
    .radio { width: 16px; height: 16px; margin-top: 2px; border-radius: 50%; border: 1.5px solid var(--line-2); display: grid; place-items: center; }
    .mode-opt[aria-checked="true"] .radio { border-color: var(--ink); }
    .mode-opt[aria-checked="true"] .radio::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ink); }
    .mode-t { font-weight: 600; font-size: 14px; }
    .mode-s { font-size: 13px; color: var(--ink-2); }
    .pop-foot { margin: 6px 4px 2px; padding: 10px 8px 4px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--ink-3); }

    /* ---------- page ---------- */
    main { max-width: 1180px; margin: 0 auto; padding: 36px 24px 96px; }
    .hero h1 {
      font-size: 36px; line-height: 1.1; letter-spacing: -0.03em; font-weight: 700; max-width: 780px;
    }
    .hero p { margin-top: 12px; max-width: 720px; font-size: 16.5px; line-height: 1.55; color: var(--ink-2); }
    .track { margin-top: 14px; font-size: 14px; color: var(--ink-2); }
    .track strong { color: var(--ink); font-weight: 600; }
    .page-h h1 { font-size: 28px; line-height: 1.15; letter-spacing: -0.025em; font-weight: 700; }
    .page-h p { margin-top: 8px; max-width: 720px; color: var(--ink-2); font-size: 15.5px; }

    /* ---------- steps ---------- */
    .steps { list-style: none; padding: 0; margin: 30px 0 26px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .step { position: relative; display: flex; gap: 12px; align-items: flex-start; padding-right: 18px; }
    .step::after {
      content: ""; position: absolute; left: 38px; right: 12px; top: 13px; height: 1px; background: var(--line-2);
    }
    .step:last-child::after { display: none; }
    .step-n {
      position: relative; z-index: 1; flex: none; width: 27px; height: 27px; border-radius: 50%;
      display: grid; place-items: center; font-size: 12.5px; font-weight: 650;
      background: var(--surface); border: 1px solid var(--line-2); color: var(--ink-3);
      transition: background 0.25s, border-color 0.25s, color 0.25s;
    }
    .step-b { position: relative; z-index: 1; display: grid; padding-right: 8px; background: transparent; }
    .step-t { font-weight: 600; font-size: 14px; line-height: 27px; background: var(--bg); padding-right: 8px; width: max-content; }
    .step-s { font-size: 13px; color: var(--ink-3); line-height: 1.4; }
    .step.done .step-n { background: var(--accent); border-color: var(--accent); color: #fff; }
    .step.active .step-n { border-color: var(--ink); color: var(--ink); }
    .step.bad .step-n { background: var(--bad); border-color: var(--bad); color: #fff; }
    .step.done .step-s, .step.active .step-s { color: var(--ink-2); }

    /* ---------- layout ---------- */
    .grid-run { display: grid; grid-template-columns: 350px minmax(0, 1fr); gap: 24px; align-items: start; }
    .stack { display: grid; gap: 16px; min-width: 0; }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow-1); }
    .pad { padding: 22px; }
    .card-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
    .card-h h2 { font-size: 15.5px; font-weight: 650; letter-spacing: -0.01em; }
    .eyebrow { font-size: 11.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); }
    .sticky { position: sticky; top: 86px; }

    /* ---------- form ---------- */
    .field { display: grid; gap: 6px; margin-bottom: 14px; }
    .field > label, .field > .label { font-size: 13px; font-weight: 550; color: var(--ink-2); }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .input-wrap { position: relative; display: flex; align-items: center; }
    .input {
      width: 100%; height: 40px; padding: 0 12px; border-radius: 10px;
      border: 1px solid var(--line-2); background: var(--surface); color: var(--ink);
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .input.has-suffix { padding-right: 44px; }
    .input:hover { border-color: #c4c3ba; }
    .input:focus { outline: none; border-color: var(--ink-2); box-shadow: 0 0 0 4px rgba(21, 23, 28, 0.07); }
    .suffix { position: absolute; right: 12px; font-size: 13px; color: var(--ink-3); pointer-events: none; }
    .hint { font-size: 12.5px; color: var(--ink-3); line-height: 1.45; }
    .toggle { display: flex; gap: 12px; align-items: flex-start; padding: 12px; border-radius: 12px; background: var(--surface-2); margin: 4px 0 18px; cursor: pointer; }
    .toggle input { position: absolute; opacity: 0; pointer-events: none; }
    .switch { flex: none; position: relative; width: 34px; height: 20px; border-radius: 999px; background: var(--line-2); transition: background 0.2s; margin-top: 1px; }
    .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2); transition: transform 0.22s var(--ease); }
    .toggle input:checked + .switch { background: var(--ink); }
    .toggle input:checked + .switch::after { transform: translateX(14px); }
    .toggle input:focus-visible + .switch { box-shadow: 0 0 0 4px rgba(21, 23, 28, 0.12); }
    .toggle-t { font-size: 13.5px; font-weight: 600; }

    /* ---------- buttons ---------- */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 42px; padding: 0 18px;
      border-radius: 11px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink);
      font-weight: 600; font-size: 14.5px; cursor: pointer; white-space: nowrap;
      transition: background 0.15s, border-color 0.15s, transform 0.12s, box-shadow 0.15s;
    }
    .btn:hover { background: var(--surface-2); }
    .btn:active { transform: translateY(1px); }
    .btn:focus-visible, .link:focus-visible, .seg button:focus-visible, .chip:focus-visible, .alt:focus-visible {
      outline: none; box-shadow: 0 0 0 4px rgba(15, 122, 92, 0.22);
    }
    .btn-primary { background: var(--ink); border-color: var(--ink); color: #fff; }
    .btn-primary:hover { background: #262a31; }
    .btn-accent { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 8px 20px -10px rgba(15, 122, 92, 0.7); }
    .btn-accent:hover { background: var(--accent-ink); }
    .btn[disabled] { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
    .btn-block { width: 100%; }
    .btn-sm { height: 34px; padding: 0 12px; font-size: 13.5px; border-radius: 9px; }
    .link {
      border: 0; background: none; padding: 0; cursor: pointer; font-weight: 550; color: var(--ink);
      text-decoration: underline; text-decoration-color: var(--line-2); text-underline-offset: 3px;
      transition: text-decoration-color 0.15s;
    }
    .link:hover { text-decoration-color: var(--ink); }
    .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 18px; }

    /* ---------- tags ---------- */
    .tag {
      display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px; border-radius: 999px;
      font-size: 12px; font-weight: 600; white-space: nowrap;
      background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line);
    }
    .tag.ok { background: var(--accent-soft); color: var(--accent-ink); border-color: transparent; }
    .tag.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
    .tag.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
    .tag.model { background: transparent; color: var(--ink-3); border-style: dashed; border-color: var(--line-2); }

    /* ---------- recommendation ---------- */
    .rec { padding: 26px; box-shadow: var(--shadow-2); animation: rise 0.35s var(--ease); }
    .rec-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
    .rec-name { margin-top: 6px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
    .rec-blurb { margin-top: 2px; color: var(--ink-2); font-size: 14.5px; }
    .rec-shape { margin-top: 10px; color: var(--ink-2); font-size: 13.5px; }
    .metrics { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin: 22px 0 18px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .metric { padding: 16px 16px 16px 0; min-width: 0; }
    .metric + .metric { padding-left: 18px; border-left: 1px solid var(--line); }
    .metric-l { font-size: 12.5px; color: var(--ink-3); font-weight: 500; }
    .metric-v { margin-top: 4px; font-size: 27px; line-height: 1.1; font-weight: 650; letter-spacing: -0.025em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .metric-v.modelled { color: var(--ink-2); font-weight: 600; }
    .metric-v.tone-ok { color: var(--accent-ink); }
    .metric-v.tone-bad { color: var(--bad); }
    .metric-v.id-v { font-family: var(--mono); font-size: 15px; font-weight: 500; letter-spacing: -0.01em; line-height: 1.5; padding-top: 6px; }
    .metric-n { margin-top: 4px; font-size: 12.5px; color: var(--ink-3); }
    .value-line {
      display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 12px;
      background: var(--accent-soft); color: var(--accent-ink);
    }
    .value-line .big { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; white-space: nowrap; }
    .value-line .txt { font-size: 14px; line-height: 1.45; }
    .value-line.neutral { background: var(--surface-2); color: var(--ink-2); }
    .basis { margin-top: 12px; font-size: 12.5px; color: var(--ink-3); }

    /* ---------- plan table ---------- */
    .alt {
      width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) 96px 88px 128px; gap: 14px; align-items: center;
      padding: 13px 22px; border: 0; border-top: 1px solid var(--line); background: transparent; text-align: left;
      cursor: pointer; transition: background 0.15s;
    }
    .alt:hover { background: var(--surface-2); }
    .alt.sel { background: var(--surface-2); box-shadow: inset 3px 0 0 var(--ink); }
    .alt-name { font-weight: 600; font-size: 14px; }
    .alt-shape { display: block; font-size: 12.5px; color: var(--ink-3); margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .alt-v { font-size: 14px; text-align: right; }
    .alt-t { text-align: right; }
    .alt-head { display: grid; grid-template-columns: minmax(0, 1fr) 96px 88px 128px; gap: 14px; padding: 0 22px 10px; }
    .alt-head span { font-size: 11.5px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); }
    .alt-head span:nth-child(2), .alt-head span:nth-child(3) { text-align: right; }

    /* ---------- disclosures ---------- */
    details.disclose { border-top: 1px solid var(--line); }
    details.disclose:first-child { border-top: 0; }
    details.disclose > summary {
      list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 16px 22px;
      font-weight: 600; font-size: 14.5px; transition: background 0.15s;
    }
    details.disclose > summary:hover { background: var(--surface-2); }
    details.disclose > summary::-webkit-details-marker { display: none; }
    details.disclose > summary .chev { color: var(--ink-3); transition: transform 0.22s var(--ease); display: inline-flex; }
    details[open].disclose > summary .chev { transform: rotate(90deg); }
    details.disclose > summary .hint { margin-left: auto; font-weight: 450; }
    .disclose-body { padding: 4px 22px 22px; }
    .checks { list-style: none; padding: 0; margin: 12px 0 0; display: grid; gap: 6px; font-size: 14px; }
    .checks li { display: flex; gap: 8px; align-items: flex-start; }
    .checks .ic { color: var(--accent); margin-top: 2px; display: inline-flex; }
    .facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 22px; margin: 16px 0 0; }
    .fact dt { font-size: 12px; color: var(--ink-3); font-weight: 500; }
    .fact dd { margin: 2px 0 0; font-size: 14px; overflow-wrap: anywhere; }
    .sub-h { display: flex; align-items: baseline; gap: 10px; margin: 18px 0 10px; font-size: 14px; font-weight: 650; }

    /* ---------- tables ---------- */
    .table-wrap { overflow-x: auto; }
    table.t { width: 100%; border-collapse: collapse; font-size: 14px; }
    .t th {
      text-align: left; padding: 10px 14px; font-size: 11.5px; font-weight: 600; letter-spacing: 0.06em;
      text-transform: uppercase; color: var(--ink-3); border-bottom: 1px solid var(--line); white-space: nowrap;
    }
    .t td { padding: 13px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
    .t tbody tr { transition: background 0.15s; }
    .t tbody tr:hover { background: #fafaf8; }
    .t tr:last-child td { border-bottom: 0; }
    .t .r { text-align: right; }
    .cell-sub { display: block; font-size: 12.5px; color: var(--ink-3); margin-top: 2px; }
    .pass { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 600; }
    .pass.ok { color: var(--accent-ink); }
    .pass.bad { color: var(--bad); }

    /* ---------- KPI strip ---------- */
    .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); margin: 26px 0 20px; }
    .kpi { padding: 4px 22px 4px 0; }
    .kpi + .kpi { padding-left: 22px; border-left: 1px solid var(--line); }
    .kpi-v { margin-top: 4px; font-size: 28px; line-height: 1.1; font-weight: 680; letter-spacing: -0.025em; }
    .kpi-v.modelled { color: var(--ink-2); font-weight: 600; }

    /* ---------- banners & states ---------- */
    .banner { display: flex; gap: 12px; align-items: flex-start; padding: 13px 16px; border-radius: 12px; font-size: 14px; line-height: 1.5; }
    .banner + .banner { margin-top: 10px; }
    .banner.warn { background: var(--warn-soft); color: #6b3d05; }
    .banner.bad { background: var(--bad-soft); color: #7a1a14; }
    .banner.info { background: var(--surface-2); color: var(--ink-2); }
    .banner strong { font-weight: 650; }
    .banners { margin-bottom: 24px; }
    .empty { padding: 36px 28px; border: 1px dashed var(--line-2); border-radius: 16px; text-align: left; color: var(--ink-2); background: rgba(255, 255, 255, 0.5); }
    .empty h3 { font-size: 16px; font-weight: 650; color: var(--ink); margin-bottom: 6px; }
    .skel { border-radius: 8px; background: linear-gradient(90deg, var(--surface-2) 0%, #fbfbf9 50%, var(--surface-2) 100%); background-size: 200% 100%; animation: shimmer 1.3s linear infinite; }
    .reason { font-size: 14px; color: var(--ink-2); overflow-wrap: anywhere; }
    .err { margin-top: 10px; font-size: 13px; color: var(--bad); overflow-wrap: anywhere; }

    /* ---------- live run ---------- */
    .drift { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); }
    .drift-h { display: flex; align-items: center; gap: 10px; font-weight: 650; }
    .anomaly { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; margin-top: 12px; font-size: 14px; }
    .anomaly .hint { grid-column: 2; margin-top: -6px; }

    /* ---------- cluster ---------- */
    .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .status-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; padding: 0 22px 18px; }
    .toolbar .field { margin: 0; min-width: 160px; }
    .diag { padding: 16px 22px; border-top: 1px solid var(--line); }
    .diag-h { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 14px; }
    .diag p { margin-top: 6px; font-size: 14px; color: var(--ink-2); }
    .diag ul { margin: 8px 0 0; padding-left: 18px; font-size: 13.5px; color: var(--ink-2); }

    /* ---------- agent ---------- */
    .agent { margin-top: 28px; }
    .log { list-style: none; padding: 0; margin: 14px 0 0; display: grid; gap: 6px; max-height: 280px; overflow: auto; font-size: 13px; }
    .log li { display: grid; grid-template-columns: 92px 1fr; gap: 10px; padding: 7px 10px; border-radius: 9px; background: var(--surface-2); }
    .log .k { font-size: 11.5px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-3); padding-top: 1px; }
    .log .v { overflow-wrap: anywhere; }
    .summary { margin-top: 14px; padding: 14px 16px; border-radius: 12px; background: var(--accent-soft); color: var(--accent-ink); font-size: 14px; white-space: pre-wrap; }

    /* ---------- scatter ---------- */
    .scatter { width: 100%; height: auto; display: block; }
    .scatter .grid-l { stroke: var(--line); stroke-width: 1; }
    .scatter .axis-t { fill: var(--ink-3); font-size: 11px; font-family: var(--sans); }
    .scatter .pt { transition: r 0.2s var(--ease); cursor: pointer; }
    .scatter .pt-l { font-size: 12px; font-weight: 600; fill: var(--ink); font-family: var(--sans); }
    .legend { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 8px; font-size: 12.5px; color: var(--ink-3); }
    .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
    .sliders { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; margin: 6px 0 14px; }
    .slider label { display: flex; justify-content: space-between; font-size: 13px; font-weight: 550; color: var(--ink-2); }
    .slider input[type="range"] { width: 100%; margin-top: 8px; accent-color: var(--ink); }

    /* ---------- modal ---------- */
    .scrim {
      position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 24px;
      background: rgba(21, 23, 28, 0.38); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
      animation: fade 0.18s ease;
    }
    .modal {
      width: min(620px, 100%); max-height: 88vh; overflow: auto; border-radius: 18px;
      background: var(--surface); box-shadow: var(--shadow-3); animation: rise 0.24s var(--ease);
    }
    .modal-h { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; padding: 22px 24px 16px; border-bottom: 1px solid var(--line); }
    .modal-h h2 { font-size: 18px; font-weight: 700; letter-spacing: -0.015em; }
    .modal-b { padding: 18px 24px; display: grid; gap: 18px; }
    .modal-f { display: flex; justify-content: flex-end; gap: 10px; padding: 16px 24px 22px; border-top: 1px solid var(--line); }
    .rows { display: grid; }
    .rows > div { display: flex; justify-content: space-between; gap: 16px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
    .rows > div:last-child { border-bottom: 0; }
    .rows span:first-child { color: var(--ink-2); }
    .rows span:last-child { text-align: right; font-weight: 550; overflow-wrap: anywhere; }
    .icon-btn { border: 0; background: transparent; cursor: pointer; color: var(--ink-3); padding: 4px; border-radius: 8px; display: inline-flex; }
    .icon-btn:hover { background: var(--surface-2); color: var(--ink); }
    .warns { padding: 14px 16px; border-radius: 12px; background: var(--warn-soft); color: #6b3d05; font-size: 13.5px; }
    .warns ul { margin: 6px 0 0; padding-left: 18px; display: grid; gap: 4px; }

    @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }

    @media (max-width: 980px) {
      .topbar-inner { grid-template-columns: auto 1fr; height: auto; padding: 10px 16px; row-gap: 10px; }
      .topbar-inner .seg { grid-column: 1 / -1; grid-row: 2; justify-self: stretch; }
      .grid-run, .grid-2 { grid-template-columns: 1fr; }
      .sticky { position: static; }
      .steps { grid-template-columns: repeat(2, minmax(0, 1fr)); row-gap: 18px; }
      .step::after { display: none; }
      .kpis, .status-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); row-gap: 18px; }
      .kpi:nth-child(3) { padding-left: 0; border-left: 0; }
      .sliders { grid-template-columns: 1fr; }
    }
    @media (max-width: 620px) {
      main { padding: 24px 16px 72px; }
      .hero h1 { font-size: 28px; }
      .metrics { grid-template-columns: 1fr; }
      .metric + .metric { padding-left: 0; border-left: 0; border-top: 1px solid var(--line); }
      .alt, .alt-head { grid-template-columns: minmax(0, 1fr) 80px 72px; }
      .alt-t, .alt-head span:nth-child(4) { display: none; }
      .facts { grid-template-columns: 1fr; }
      .brand span { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Same origin when the agent service serves this page; the direct service
    // URL only when the file is opened from disk.
    const API_BASE =
      window.location.origin && !window.location.origin.startsWith("file://")
        ? ""
        : "https://agentic-compute-agent-340107663828.us-central1.run.app";

    const TERMINAL_STATES = ["COMPLETED", "FAILED", "PREEMPTED", "CANCELLED", "TIMEOUT"];
    const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

    // ------------------------------------------------------------------
    // Formatting. Modelled figures carry an "≈" and never share the look of
    // a measured one; a missing value renders as a dash, never as 0 or NaN.
    // ------------------------------------------------------------------
    const isNum = (v) => v !== null && v !== undefined && v !== "" && !isNaN(Number(v)) && isFinite(Number(v));
    const num = (v, d = 0) => (isNum(v) ? Number(v) : d);
    const pad2 = (n) => (n < 10 ? "0" : "") + n;

    function eur(v) {
      if (!isNum(v)) return "—";
      const n = Number(v);
      if (n > 0 && n < 0.01) return "< €0.01";
      return (n < 0 ? "−€" : "€") + Math.abs(n).toFixed(2);
    }

    function approxEur(v) {
      if (!isNum(v)) return "—";
      const n = Number(v);
      return n < 0.01 ? "< €0.01" : `≈ €${n.toFixed(2)}`;
    }

    function mins(v) {
      if (!isNum(v)) return "—";
      const total = Math.round(Math.max(0, Number(v)));
      if (Number(v) < 1) return "< 1 min";
      if (total < 100) return `${total} min`;
      const h = Math.floor(total / 60);
      const m = total % 60;
      return m ? `${h} h ${m} min` : `${h} h`;
    }

    const pct = (v, digits = 0) => (isNum(v) ? `${Number(v).toFixed(digits)}%` : "—");

    function when(ts) {
      if (!isNum(ts)) return "—";
      const date = new Date(Number(ts) * 1000);
      return `${MONTHS[date.getMonth()]} ${date.getDate()}, ${pad2(date.getHours())}:${pad2(date.getMinutes())}`;
    }

    const newRunId = () => `run-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 5)}`;

    // ------------------------------------------------------------------
    // Plans. Every field read on an ExecutionPlan goes through a variable
    // named `plan`, which the UI/model contract test checks file-wide.
    // ------------------------------------------------------------------
    const PLAN_COPY = {
      cost_optimized: { name: "Lowest cost", blurb: "The cheapest plan that still meets your deadline." },
      deadline_favored: { name: "Fastest", blurb: "Finishes first, whatever it costs." },
      balanced_tradeoff: { name: "Balanced", blurb: "Balances cost against time to result." },
    };
    const planName = (plan) =>
      PLAN_COPY[plan.plan_type] ? PLAN_COPY[plan.plan_type].name : plan.title || plan.plan_type || "Plan";
    const planBlurb = (plan) => (PLAN_COPY[plan.plan_type] ? PLAN_COPY[plan.plan_type].blurb : plan.ranking_rationale || "");
    const planCost = (plan) => num(plan.estimated_cost_eur);
    const planTime = (plan) => num(plan.total_time_to_result_minutes);
    const planShape = (plan) =>
      `${plan.machine_type} · ${plan.cpu} vCPU${num(plan.gpu) > 0 ? ` · ${plan.gpu} GPU` : ""} · ${plan.provisioning_model}`;

    // The value claim is computed against another plan the API returned for
    // the same job, never against an invented baseline.
    function comparisonValue(comparison) {
      const plans = (comparison && comparison.plans) || [];
      if (plans.length === 0) return null;
      const recommended = plans.find((plan) => plan.plan_id === comparison.recommended_plan_id) || plans[0];
      const fastest = plans.reduce((best, plan) => (planTime(plan) < planTime(best) ? plan : best), plans[0]);
      const saved = fastest.plan_id === recommended.plan_id ? 0 : Math.max(0, planCost(fastest) - planCost(recommended));
      const savedPct = planCost(fastest) > 0 ? (saved / planCost(fastest)) * 100 : 0;
      return { plans, recommended, fastest, saved, savedPct };
    }

    // A fallback is named by the plan it points to, not by its opaque id.
    function planLabelById(plans, id) {
      if (!id) return null;
      const found = (plans || []).find((plan) => plan.plan_id === id);
      if (found) return `${planName(found)} · ${found.machine_type}`;
      const type = Object.keys(PLAN_COPY).find((t) => String(id).indexOf(`-${t}-`) >= 0);
      return type ? PLAN_COPY[type].name : String(id);
    }

    // Server points are full sentences or fragments: join them into one
    // sentence without doubling a full stop one of them already carries.
    function listSentence(items) {
      return items.map((item) => String(item).trim().replace(/[.;,\s]+$/, "")).join(" · ") + ".";
    }

    const COST_BASIS_COPY = {
      modelled_flat_rate_hypothesis: "modelled at a flat rate",
      observed_allocation: "measured allocation",
    };
    function costBasisLabel(basis) {
      return COST_BASIS_COPY[basis] || String(basis || "unverified").replace(/_/g, " ");
    }

    const MODE_COPY = {
      advisory: { label: "Advisory", line: "AgentGrid recommends. Nothing is ever submitted." },
      validation: { label: "Validation", line: "You approve each plan before it runs." },
      delegation: { label: "Delegation", line: "AgentGrid submits on its own, within a spending ceiling." },
    };
    const HEALTH_COPY = {
      HEALTHY: ["On track", "ok"],
      WARNING_DRIFT: ["Drifting", "warn"],
      DEGRADED_DRIFT: ["Degraded", "warn"],
      CRITICAL_DRIFT: ["Critical drift", "bad"],
    };
    const RECON_COPY = {
      estimated: "estimate only",
      calculated_from_usage: "from measured usage",
      reconciled_billed: "billed",
    };
    const VERDICT_COPY = {
      HIGHLY_RESILIENT: "Holds under every shock",
      MODERATELY_RESILIENT: "Holds under most shocks",
      VULNERABLE_UNDER_STRESS: "Breaks under stress",
    };

    function statusTone(status) {
      const s = String(status || "").toUpperCase();
      if (["COMPLETED", "SUBMITTED", "ALREADY_SUBMITTED", "VERIFIED", "APPLIED", "APPROVED"].indexOf(s) >= 0) return "ok";
      if (["FAILED", "BLOCKED", "ERROR", "MISMATCH", "PREEMPTED", "CANCELLED", "TIMEOUT"].indexOf(s) >= 0) return "bad";
      if (["PENDING", "PENDING_VERIFICATION", "QUEUED", "UNVERIFIED"].indexOf(s) >= 0) return "warn";
      return "neutral";
    }

    // A run carries a measured cost only once the runtime observed usage. Same
    // rule as the server's measured-usage total, so a row, the KPI and the
    // headline never disagree about what was measured.
    const isMeasured = (r) =>
      r.reconciliation_status === "reconciled_billed" ||
      (r.reconciliation_status === "calculated_from_usage" && num(r.final_actual_duration_minutes) > 0);

    // ------------------------------------------------------------------
    // Small stateless components (all hooks live in App).
    // ------------------------------------------------------------------
    const ICONS = {
      check: "M4.5 10.5l3.5 3.5 7.5-8",
      x: "M5.5 5.5l9 9M14.5 5.5l-9 9",
      chevron: "M8 5l5 5-5 5",
      caret: "M6 8l4 4 4-4",
      shield: "M10 2.8l5.8 2.1v4.4c0 3.6-2.5 6.6-5.8 7.9-3.3-1.3-5.8-4.3-5.8-7.9V4.9L10 2.8z",
      arrow: "M4.5 10h11M11 5.5l4.5 4.5-4.5 4.5",
      alert: "M10 3.5l7 12.5H3l7-12.5zM10 8.5v3.5M10 14.2v.1",
      spark: "M10 3v3.2M10 13.8V17M3 10h3.2M13.8 10H17M5.2 5.2l2.2 2.2M12.6 12.6l2.2 2.2M5.2 14.8l2.2-2.2M12.6 7.4l2.2-2.2",
    };

    function Icon({ name, size = 16 }) {
      return (
        <svg width={size} height={size} viewBox="0 0 20 20" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
          <path d={ICONS[name]} />
        </svg>
      );
    }

    function BrandMark() {
      return (
        <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true">
          <rect x="1" y="1" width="26" height="26" rx="8" fill="#15171c" />
          <rect x="7" y="7" width="5.6" height="5.6" rx="1.7" fill="#ffffff" opacity="0.92" />
          <rect x="15.4" y="7" width="5.6" height="5.6" rx="1.7" fill="#ffffff" opacity="0.32" />
          <rect x="7" y="15.4" width="5.6" height="5.6" rx="1.7" fill="#ffffff" opacity="0.32" />
          <rect x="15.4" y="15.4" width="5.6" height="5.6" rx="1.7" fill="#3fcf98" />
        </svg>
      );
    }

    function Tag({ tone = "neutral", title, children }) {
      return (
        <span className={`tag ${tone}`} title={title}>
          {children}
        </span>
      );
    }

    function Metric({ label, value, note, tone, modelled, id }) {
      return (
        <div className="metric">
          <div className="metric-l">{label}</div>
          <div
            className={`metric-v num${modelled ? " modelled" : ""}${tone ? ` tone-${tone}` : ""}${id ? " id-v" : ""}`}
            title={id ? String(value) : undefined}
          >
            {value}
          </div>
          {note ? <div className="metric-n">{note}</div> : null}
        </div>
      );
    }

    function Kpi({ label, value, note, modelled }) {
      return (
        <div className="kpi">
          <div className="metric-l">{label}</div>
          <div className={`kpi-v num${modelled ? " modelled" : ""}`}>{value}</div>
          {note ? <div className="metric-n">{note}</div> : null}
        </div>
      );
    }

    function Fact({ label, children }) {
      return (
        <div className="fact">
          <dt>{label}</dt>
          <dd>{children}</dd>
        </div>
      );
    }

    function Pass({ ok }) {
      return ok ? (
        <span className="pass ok">
          <Icon name="check" size={14} /> holds
        </span>
      ) : (
        <span className="pass bad">
          <Icon name="x" size={14} /> breaks
        </span>
      );
    }

    function Skeleton({ rows = 3 }) {
      const lines = [];
      for (let i = 0; i < rows; i++) {
        lines.push(<div key={i} className="skel" style={{ height: i === 0 ? 22 : 14, width: i === 0 ? "46%" : `${88 - i * 12}%`, marginTop: i === 0 ? 0 : 12 }} />);
      }
      return <div className="card pad">{lines}</div>;
    }

    // Cost against time to result for every compared plan. Point size encodes
    // interruption risk; the tooltip carries the carbon tier, so all four
    // dimensions of the Pareto analysis reach the chart.
    function ParetoScatter({ plans, recommendedId, selectedId, onSelect }) {
      const pts = (plans || []).filter((plan) => isNum(plan.estimated_cost_eur) && isNum(plan.total_time_to_result_minutes));
      if (pts.length === 0) return <p className="hint">No plan to plot.</p>;
      const W = 560;
      const H = 230;
      const P = { l: 52, r: 110, t: 14, b: 38 };
      const xMax = Math.max.apply(null, pts.map((plan) => planTime(plan))) * 1.18 || 1;
      const yMax = Math.max.apply(null, pts.map((plan) => planCost(plan))) * 1.25 || 1;
      const sx = (v) => P.l + (v / xMax) * (W - P.l - P.r);
      const sy = (v) => H - P.b - (v / yMax) * (H - P.t - P.b);
      const ticks = [0, 0.5, 1];
      return (
        <div>
          <svg className="scatter" viewBox={`0 0 ${W} ${H}`} role="img" aria-label="Estimated cost against time to result for each plan">
            {ticks.map((t) => (
              <g key={`y${t}`}>
                <line className="grid-l" x1={P.l} x2={W - P.r} y1={sy(yMax * t)} y2={sy(yMax * t)} />
                <text className="axis-t" x={P.l - 8} y={sy(yMax * t) + 4} textAnchor="end">
                  {`€${(yMax * t).toFixed(2)}`}
                </text>
              </g>
            ))}
            {ticks.map((t) => (
              <text key={`x${t}`} className="axis-t" x={sx(xMax * t)} y={H - P.b + 18} textAnchor="middle">
                {`${Math.round(xMax * t)} min`}
              </text>
            ))}
            <text className="axis-t" x={W - P.r} y={H - 4} textAnchor="end">
              time to result →
            </text>
            {pts.map((plan) => {
              const isRec = plan.plan_id === recommendedId;
              const isSel = plan.plan_id === selectedId;
              const radius = 7 + Math.min(1, num(plan.interruption_risk_score)) * 7;
              const fill = isRec ? "#0f7a5c" : plan.is_pareto_optimal ? "#15171c" : "#ffffff";
              return (
                <g key={plan.plan_id} onClick={() => onSelect && onSelect(plan.plan_id)}>
                  <title>
                    {`${planName(plan)} · ${approxEur(plan.estimated_cost_eur)} · ${mins(plan.total_time_to_result_minutes)} · interruption risk ${pct(num(plan.interruption_risk_score) * 100)} · carbon ${plan.green_tier || "unknown"}`}
                  </title>
                  <circle
                    className="pt"
                    cx={sx(planTime(plan))}
                    cy={sy(planCost(plan))}
                    r={radius}
                    fill={fill}
                    stroke={isSel ? "#15171c" : isRec ? "#0f7a5c" : "#7d838d"}
                    strokeWidth={isSel ? 3 : 1.5}
                    fillOpacity={isRec || plan.is_pareto_optimal ? 0.92 : 1}
                  />
                  <text className="pt-l" x={sx(planTime(plan)) + radius + 6} y={sy(planCost(plan)) + 4}>
                    {planName(plan)}
                  </text>
                </g>
              );
            })}
          </svg>
          <div className="legend">
            <span><i style={{ background: "#0f7a5c" }} />Recommended</span>
            <span><i style={{ background: "#15171c" }} />On the Pareto frontier</span>
            <span><i style={{ background: "#fff", border: "1.5px solid #7d838d" }} />Dominated</span>
            <span>Bigger point = higher interruption risk · hover for carbon</span>
          </div>
        </div>
      );
    }

    function App() {
      const [activeTab, setActiveTab] = useState("run");

      // What the operator declares about the job. Each field is sent as typed.
      const [jobName, setJobName] = useState("nightly-risk-batch");
      const [command, setCommand] = useState("sleep 30");
      const [cpuRequested, setCpuRequested] = useState(2);
      const [memoryGbRequested, setMemoryGbRequested] = useState(4);
      const [serialMinutes, setSerialMinutes] = useState(60);
      const [deadline, setDeadline] = useState(60);
      const [budget, setBudget] = useState(5);
      const [interruptible, setInterruptible] = useState(true);
      // Plans, approvals and the idempotency ledger are keyed by workload, so
      // every run gets its own id. It stays fixed while the operator edits and
      // re-compares, and changes only when a new run is started.
      const [runId, setRunId] = useState(newRunId());

      // Governance. The server enforces the mode; the UI only shows what the
      // server says it holds.
      const [controlMode, setControlMode] = useState("validation");
      const [delegationBudget, setDelegationBudget] = useState(10);
      const [serverControl, setServerControl] = useState(null);
      const [modeSyncError, setModeSyncError] = useState(null);
      const [showGovernance, setShowGovernance] = useState(false);

      // Runtime truth: what the cluster (or simulator) reports.
      const [snapshotPayload, setSnapshotPayload] = useState(null);
      const [snapshotError, setSnapshotError] = useState(null);

      // Plans.
      const [planComparison, setPlanComparison] = useState(null);
      const [loadingPlans, setLoadingPlans] = useState(false);
      const [planError, setPlanError] = useState(null);
      const [selectedPlanId, setSelectedPlanId] = useState(null);

      // Approval and execution: always the server's own answer.
      const [approvedPlanId, setApprovedPlanId] = useState(null);
      const [approvingPlanId, setApprovingPlanId] = useState(null);
      const [approvalError, setApprovalError] = useState(null);
      const [pendingExecution, setPendingExecution] = useState(null);
      const [executingPlanId, setExecutingPlanId] = useState(null);
      const [executionResult, setExecutionResult] = useState(null);

      // Live drift of the submitted run.
      const [anomalyReport, setAnomalyReport] = useState(null);
      const [anomaliesError, setAnomaliesError] = useState(null);

      // What-if stress test, seeded with the backend defaults.
      const [whatIfPreemptions, setWhatIfPreemptions] = useState(2);
      const [whatIfBudgetShock, setWhatIfBudgetShock] = useState(-20);
      const [whatIfDeadlineCompression, setWhatIfDeadlineCompression] = useState(-25);
      const [whatIfResult, setWhatIfResult] = useState(null);
      const [loadingWhatIf, setLoadingWhatIf] = useState(false);
      const [whatIfError, setWhatIfError] = useState(null);

      // Ledger. `null` means "not loaded yet", `[]` means "loaded, empty".
      const [historyRecords, setHistoryRecords] = useState(null);
      const [historyError, setHistoryError] = useState(null);
      const [finops, setFinops] = useState(null);
      const [finopsError, setFinopsError] = useState(null);

      // Cluster tools.
      const [allowedRegions, setAllowedRegions] = useState("");
      const [allowRegionChange, setAllowRegionChange] = useState(false);
      const [capacityCandidates, setCapacityCandidates] = useState(null);
      const [capacityMeta, setCapacityMeta] = useState(null);
      const [loadingCandidates, setLoadingCandidates] = useState(false);
      const [capacityError, setCapacityError] = useState(null);
      const [diagnosticsList, setDiagnosticsList] = useState(null);
      const [loadingDiagnostics, setLoadingDiagnostics] = useState(false);
      const [diagnosticsError, setDiagnosticsError] = useState(null);

      // Autonomous mode (Gemini agent over MCP).
      const [isOptimizing, setIsOptimizing] = useState(false);
      const [streamLogs, setStreamLogs] = useState([]);
      const [finalSummary, setFinalSummary] = useState(null);

      const skipFirstRunEffect = useRef(true);
      const WORKLOAD_ID = runId;

      // ---------------- derived state ----------------
      const execRuntime = snapshotPayload ? snapshotPayload.execution_runtime || snapshotPayload.runtime || null : null;
      const onSlurm = execRuntime === "slurm";
      const runtimeMismatch = !!(snapshotPayload && snapshotPayload.runtime_mismatch);
      const snap = (snapshotPayload && snapshotPayload.snapshot) || null;
      // The Slurm adapter reports a placeholder (job "1", PENDING) until it
      // submits or finds a job. It is not a job: never show or diagnose it.
      const reportedWl = (snap && snap.workload) || null;
      const liveWl = reportedWl && reportedWl.job_found !== false ? reportedWl : null;
      // Only a job the runtime reports as waiting or failed has something to
      // diagnose; a running or finished one is not held back by anything.
      const liveState = liveWl ? String(liveWl.status || "").toUpperCase() : "";
      const jobFailed = !!liveWl && (!!liveWl.failed || liveState === "FAILED");
      const jobWaiting =
        !!liveWl && !jobFailed && !liveWl.done && liveState !== "RUNNING" && liveState !== "COMPLETED";
      const liveCluster = (snap && snap.cluster) || null;
      const slurmAction = snapshotPayload ? snapshotPayload.slurm_verification : null;
      const targetName = execRuntime === null ? "the runtime" : onSlurm ? "Slurm" : "the simulator";
      const mode = serverControl ? serverControl.control_mode : controlMode;
      const modeCopy = MODE_COPY[mode] || MODE_COPY.validation;
      const ceiling = serverControl && serverControl.delegation_policy ? serverControl.delegation_policy.max_budget_eur : delegationBudget;
      const value = comparisonValue(planComparison);
      const activePlan = value ? value.plans.find((plan) => plan.plan_id === selectedPlanId) || value.recommended : null;
      const submitted =
        !!executionResult && (executionResult.status === "submitted" || executionResult.status === "already_submitted");
      // Only telemetry about *our* job may describe the run: a snapshot proxied
      // from another runtime, or still showing an older job, must not.
      const ourJobVisible =
        submitted && !!liveWl && !runtimeMismatch && String(liveWl.id) === String(executionResult.job_id);
      const runActive = ourJobVisible && !liveWl.done && !liveWl.failed;
      // Runs behind the measured-usage total: zero means nothing was measured,
      // which must not be shown as a measured €0.00.
      const measuredRuns = finops ? finops.financial_tiers.measured_workloads : null;
      // A value true on every row belongs above the table, not in each row.
      const capacityRows = capacityCandidates ? capacityCandidates.slice(0, 12) : null;
      const sharedOnEveryRow = (read) => {
        if (!capacityRows || capacityRows.length < 2) return null;
        const first = read(capacityRows[0]);
        return first && capacityRows.every((c) => read(c) === first) ? first : null;
      };
      const sharedCapacityModel = sharedOnEveryRow((c) => String(c.provisioning_model || ""));
      const sharedQuotaProject = sharedOnEveryRow((c) => String(c.quota_project || ""));
      const sharedQuotaMetric = sharedOnEveryRow((c) => String(c.quota_metric || ""));
      const sharedQuotaStatus = sharedOnEveryRow((c) => String(c.quota_status || ""));
      const sharedQuotaUsage = sharedOnEveryRow((c) =>
        isNum(c.quota_usage) && isNum(c.quota_limit) ? `${c.quota_usage} of ${c.quota_limit} used` : ""
      );
      // Same verdict and same figures on every row: the Quota column says
      // nothing row by row, so it moves above the table as one sentence.
      const quotaHoisted = !!sharedQuotaStatus && !!sharedQuotaUsage;
      const sharedCapacitySource = sharedOnEveryRow((c) =>
        [c.data_provenance, c.state_stage].filter(Boolean).join(", ").replace(/_/g, " ")
      );
      const sharedQuota =
        sharedQuotaProject || sharedQuotaMetric || quotaHoisted
          ? `checked against ${sharedQuotaMetric ? `the ${sharedQuotaMetric} quota` : "the quota"}${sharedQuotaProject ? ` of project ${sharedQuotaProject}` : ""}` +
            (quotaHoisted ? `: ${sharedQuotaStatus.replace(/_/g, " ").toLowerCase()}, ${sharedQuotaUsage}` : "")
          : null;
      const capacityCommon = [
        sharedCapacityModel && `${sharedCapacityModel.toLowerCase()} capacity`,
        sharedQuota,
        sharedCapacitySource && `source: ${sharedCapacitySource}`,
      ].filter(Boolean);

      const describeError = async (res, fallback) => {
        try {
          const body = await res.json();
          if (body && body.detail) {
            return `HTTP ${res.status}: ${typeof body.detail === "string" ? body.detail : JSON.stringify(body.detail)}`;
          }
          if (body && body.error) return `HTTP ${res.status}: ${body.error}`;
        } catch (e) {
          /* body was not JSON */
        }
        return `${fallback} (HTTP ${res.status})`;
      };

      const postJson = (path, payload) =>
        fetch(`${API_BASE}${path}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });

      // Built from the current form values every time: nothing is hard-coded.
      const buildWorkloadProfile = () => ({
        workload_id: WORKLOAD_ID,
        name: String(jobName).trim() || "batch-job",
        command: String(command).trim() || undefined,
        cpu_requested: Number(cpuRequested),
        memory_mb_requested: Math.round(Number(memoryGbRequested) * 1024),
        // Single-vCPU minutes of work; the planner scales it per machine.
        estimated_duration_minutes: Number(serialMinutes),
        estimation_source: "user_specified",
        deadline_minutes_from_start: Number(deadline),
        budget_amount: Number(budget),
        is_parallelizable: true,
        is_interruptible: interruptible,
        allow_spot: interruptible,
        supports_checkpointing: interruptible,
        checkpoint_location: interruptible ? `gs://agentgrid-checkpoints/${WORKLOAD_ID}` : undefined,
      });

      // ---------------- fetchers ----------------
      const fetchSnapshot = async () => {
        try {
          const res = await fetch(`${API_BASE}/api/snapshot`);
          if (!res.ok) {
            setSnapshotError(await describeError(res, "Runtime status unavailable"));
            return;
          }
          const body = await res.json();
          setSnapshotPayload(body);
          setSnapshotError(body.error ? String(body.error) : null);
        } catch (e) {
          setSnapshotError(`Unable to reach the API: ${e.message}`);
        }
      };

      const fetchPlanComparison = async () => {
        setLoadingPlans(true);
        setPlanError(null);
        try {
          const res = await postJson("/api/plans/compare", {
            workload_profile: buildWorkloadProfile(),
            cluster_total_cpu: num(liveCluster && liveCluster.total_cpu, 128) || 128,
          });
          if (!res.ok) {
            setPlanError(await describeError(res, "Plan comparison failed"));
            setPlanComparison(null);
            return;
          }
          setPlanComparison(await res.json());
          setSelectedPlanId(null);
          setWhatIfResult(null);
        } catch (e) {
          setPlanError(`Unable to reach the API: ${e.message}`);
          setPlanComparison(null);
        } finally {
          setLoadingPlans(false);
        }
      };

      const refreshControl = async () => {
        try {
          const res = await fetch(`${API_BASE}/api/workloads/${WORKLOAD_ID}/control`);
          if (res.ok) setServerControl(await res.json());
        } catch (e) {
          /* the next explicit sync reports connectivity problems */
        }
      };

      // The mode is enforced by the server, so the selector must push it there.
      const syncControlMode = async (nextMode, budgetEur) => {
        setModeSyncError(null);
        try {
          const res = await postJson(`/api/workloads/${WORKLOAD_ID}/control`, {
            control_mode: nextMode,
            delegation_policy: { max_budget_eur: Number(budgetEur) },
          });
          if (!res.ok) {
            setModeSyncError(await describeError(res, "Could not set the control mode"));
            return;
          }
          setServerControl(await res.json());
        } catch (e) {
          setModeSyncError(`Unable to reach the API: ${e.message}`);
        }
      };

      const applyControlMode = (nextMode) => {
        setControlMode(nextMode);
        syncControlMode(nextMode, delegationBudget);
      };

      const handleApprovePlan = async (planId) => {
        setApprovalError(null);
        setApprovingPlanId(planId);
        try {
          const res = await postJson("/api/plans/approve", { plan_id: planId, workload_id: WORKLOAD_ID });
          if (!res.ok) {
            // Never show an approval the server did not record.
            setApprovedPlanId(null);
            setApprovalError(await describeError(res, "Approval refused"));
            return;
          }
          const body = await res.json();
          if (body.status === "approved") {
            setApprovedPlanId(planId);
          } else {
            setApprovedPlanId(null);
            setApprovalError(body.reason || `Approval refused: ${body.status}`);
          }
        } catch (e) {
          setApprovedPlanId(null);
          setApprovalError(`Unable to reach the API: ${e.message}`);
        } finally {
          setApprovingPlanId(null);
        }
      };

      const handleExecutePlan = async (plan) => {
        setExecutionResult(null);
        setAnomalyReport(null);
        setExecutingPlanId(plan.plan_id);
        try {
          const res = await postJson("/api/execute-plan", {
            workload_profile: buildWorkloadProfile(),
            plan: plan,
            control_mode: controlMode,
            delegation_policy: { max_budget_eur: Number(delegationBudget) },
          });
          const body = await res.json().catch(() => ({}));
          if (!res.ok) {
            setExecutionResult({
              status: "error",
              reason: body.detail || `Execution request refused (HTTP ${res.status})`,
            });
            return;
          }
          // Display exactly what the server returned, including "blocked".
          setExecutionResult(body);
          if (body.status === "submitted" || body.status === "already_submitted") {
            fetchSnapshot();
            fetchHistory();
            fetchFinops();
            refreshControl();
          }
        } catch (e) {
          setExecutionResult({ status: "error", reason: `Unable to reach the API: ${e.message}` });
        } finally {
          setExecutingPlanId(null);
        }
      };

      const fetchHistory = async () => {
        setHistoryError(null);
        try {
          const res = await fetch(`${API_BASE}/api/history`);
          if (!res.ok) {
            setHistoryError(await describeError(res, "Ledger unavailable"));
            setHistoryRecords([]);
            return;
          }
          const body = await res.json();
          setHistoryRecords(body.records || []);
        } catch (e) {
          setHistoryError(`Unable to reach the API: ${e.message}`);
          setHistoryRecords([]);
        }
      };

      const fetchFinops = async () => {
        setFinopsError(null);
        try {
          const res = await fetch(`${API_BASE}/api/portfolio/finops`);
          if (!res.ok) {
            setFinopsError(await describeError(res, "Portfolio figures unavailable"));
            setFinops(null);
            return;
          }
          setFinops(await res.json());
        } catch (e) {
          setFinopsError(`Unable to reach the API: ${e.message}`);
          setFinops(null);
        }
      };

      // Drift of the submitted run, from what the runtime observed.
      const fetchAnomalies = async () => {
        setAnomaliesError(null);
        try {
          const wl = liveWl || {};
          const clk = liveCluster || {};
          // No progress_pct: neither runtime exposes a trustworthy one here, and
          // a constant 0% would be reported as a stalled job.
          const body = {
            workload_profile: buildWorkloadProfile(),
            elapsed_minutes: num(clk.current_time_minutes),
            current_cost_eur: num(wl.accrued_cost_eur),
          };
          const res = await postJson(`/api/workloads/${WORKLOAD_ID}/anomalies`, body);
          if (!res.ok) {
            setAnomaliesError(await describeError(res, "Drift detection failed"));
            return;
          }
          setAnomalyReport(await res.json());
        } catch (e) {
          setAnomaliesError(`Unable to reach the API: ${e.message}`);
        }
      };

      // Stress the plans on screen with the operator's own shocks.
      const runWhatIf = async () => {
        const plans = (planComparison && planComparison.plans) || [];
        if (plans.length === 0) {
          setWhatIfError("Compare plans first: there is nothing to stress-test.");
          return;
        }
        setLoadingWhatIf(true);
        setWhatIfError(null);
        try {
          const res = await postJson("/api/plans/what-if", {
            workload_id: WORKLOAD_ID,
            plans: plans,
            workload_profile: buildWorkloadProfile(),
            forced_preemptions: Number(whatIfPreemptions),
            budget_shock_pct: Number(whatIfBudgetShock),
            deadline_compression_pct: Number(whatIfDeadlineCompression),
          });
          if (!res.ok) {
            setWhatIfError(await describeError(res, "Stress test failed"));
            setWhatIfResult(null);
            return;
          }
          setWhatIfResult(await res.json());
        } catch (e) {
          setWhatIfError(`Unable to reach the API: ${e.message}`);
          setWhatIfResult(null);
        } finally {
          setLoadingWhatIf(false);
        }
      };

      const fetchCapacityCandidates = async () => {
        setLoadingCandidates(true);
        setCapacityError(null);
        try {
          const res = await postJson("/api/capacity-search", {
            cpu_requested: Number(cpuRequested),
            memory_gb_requested: Number(memoryGbRequested),
            allowed_regions: allowedRegions
              .split(",")
              .map((region) => region.trim())
              .filter((region) => region.length > 0),
            allow_region_change: allowRegionChange,
          });
          if (!res.ok) {
            setCapacityError(await describeError(res, "Capacity search failed"));
            setCapacityCandidates([]);
            setCapacityMeta(null);
            return;
          }
          const body = await res.json();
          setCapacityCandidates(body.candidates || []);
          // What the server says it actually searched: a single-region answer
          // must not read as an exhaustive one.
          setCapacityMeta({
            searched_regions: body.searched_regions || (body.searched_region ? [body.searched_region] : []),
            location_note: body.location_note,
          });
        } catch (e) {
          setCapacityError(`Unable to reach the API: ${e.message}`);
          setCapacityCandidates([]);
          setCapacityMeta(null);
        } finally {
          setLoadingCandidates(false);
        }
      };

      const fetchDiagnostics = async () => {
        setDiagnosticsError(null);
        // Diagnose only the job the runtime reports, with the state it reports:
        // an invented state would come back as a confirmed finding about a job
        // that does not exist.
        if (!jobWaiting && !jobFailed) {
          setDiagnosticsList([]);
          return;
        }
        setLoadingDiagnostics(true);
        try {
          const res = await fetch(`${API_BASE}/api/diagnose?job_state=${encodeURIComponent(liveState)}`);
          if (!res.ok) {
            setDiagnosticsError(await describeError(res, "Diagnostics failed"));
            setDiagnosticsList([]);
            return;
          }
          const body = await res.json();
          setDiagnosticsList(body.diagnostics || []);
        } catch (e) {
          setDiagnosticsError(`Unable to reach the API: ${e.message}`);
          setDiagnosticsList([]);
        } finally {
          setLoadingDiagnostics(false);
        }
      };

      const startNewRun = () => {
        setPlanComparison(null);
        setSelectedPlanId(null);
        setApprovedPlanId(null);
        setApprovalError(null);
        setExecutionResult(null);
        setAnomalyReport(null);
        setWhatIfResult(null);
        setPendingExecution(null);
        setRunId(newRunId());
      };

      const runAgent = async () => {
        if (isOptimizing) return;
        setIsOptimizing(true);
        setStreamLogs([]);
        setFinalSummary(null);
        const objective =
          `Run the batch job "${jobName}" (command: ${command}; ${cpuRequested} vCPU, ${memoryGbRequested} GB RAM, ` +
          `about ${serialMinutes} single-vCPU minutes of work). It must finish within ${deadline} minutes and cost at most ` +
          `€${budget}. Compare plans, pick the cheapest one that meets the deadline, respect the governance mode, ` +
          `watch the job until it finishes, then summarise what ran and what it cost.`;
        try {
          const response = await postJson("/optimize/stream", { objective });
          if (!response.body) throw new Error("streaming is not supported by this browser");
          const reader = response.body.getReader();
          const decoder = new TextDecoder();
          let buffer = "";
          while (true) {
            const { value: chunk, done } = await reader.read();
            if (done) break;
            buffer += decoder.decode(chunk, { stream: true });
            const blocks = buffer.split("\n\n");
            buffer = blocks.pop();
            for (const block of blocks) {
              const line = block.trim();
              if (!line.startsWith("data:")) continue;
              try {
                const payload = JSON.parse(line.replace(/^data:\s*/, ""));
                if (payload.event === "started") {
                  setStreamLogs((prev) => [...prev, { kind: "session", text: `Started with ${payload.model}` }]);
                } else if (payload.event === "tool_call") {
                  setStreamLogs((prev) => [...prev, { kind: "tool", text: payload.tool }]);
                } else if (payload.event === "thinking") {
                  setStreamLogs((prev) => [...prev, { kind: "agent", text: payload.text }]);
                } else if (payload.event === "completed") {
                  setFinalSummary(payload.summary);
                  setStreamLogs((prev) => [...prev, { kind: "done", text: `Finished in ${payload.duration_seconds}s` }]);
                } else if (payload.event === "error") {
                  setStreamLogs((prev) => [...prev, { kind: "error", text: payload.error }]);
                }
              } catch (err) {
                /* ignore a malformed event */
              }
            }
          }
        } catch (err) {
          setStreamLogs((prev) => [...prev, { kind: "error", text: `Connection error: ${err.message}` }]);
        } finally {
          setIsOptimizing(false);
          fetchSnapshot();
          fetchHistory();
        }
      };

      // ---------------- effects ----------------
      useEffect(() => {
        fetchSnapshot();
        fetchHistory();
        fetchFinops();
        syncControlMode(controlMode, delegationBudget);
        // The comparison is the product's answer, so the first screen prices
        // the example job instead of showing an empty form.
        fetchPlanComparison();
        const timer = setInterval(fetchSnapshot, 5000);
        return () => clearInterval(timer);
      }, []);

      useEffect(() => {
        if (skipFirstRunEffect.current) {
          skipFirstRunEffect.current = false;
          return;
        }
        syncControlMode(controlMode, delegationBudget);
        fetchPlanComparison();
      }, [runId]);

      useEffect(() => {
        if (runActive) fetchAnomalies();
      }, [snapshotPayload]);

      const liveStatus = liveWl ? liveWl.status : null;
      useEffect(() => {
        if (ourJobVisible) {
          fetchHistory();
          fetchFinops();
        }
      }, [liveStatus]);

      useEffect(() => {
        if (activeTab === "ledger") {
          fetchHistory();
          fetchFinops();
        }
        if (activeTab === "cluster") {
          if (capacityCandidates === null && !loadingCandidates) fetchCapacityCandidates();
        }
      }, [activeTab]);

      // A diagnosis describes one job state: redo it when the view opens and
      // whenever the runtime reports a new one.
      useEffect(() => {
        if (activeTab === "cluster" && !loadingDiagnostics) fetchDiagnostics();
      }, [activeTab, liveStatus]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === "Escape") {
            setPendingExecution(null);
            setShowGovernance(false);
          }
        };
        document.addEventListener("keydown", onKey);
        return () => document.removeEventListener("keydown", onKey);
      }, []);

      // ---------------- view model ----------------
      const runtimeChip = snapshotError && !snapshotPayload
        ? { tone: "bad", label: "Runtime unreachable", title: snapshotError }
        : execRuntime === null
        ? { tone: "", label: "Connecting…", title: "Waiting for the first runtime snapshot" }
        : onSlurm
        ? { tone: "ok", label: "Slurm", title: "Plans are submitted to the Slurm cluster and checked against what it reports." }
        : runtimeMismatch && snapshotPayload.runtime === "slurm"
        ? { tone: "warn", label: "Simulator", title: "Runs from this page go to the simulator: this page isn't connected to your Slurm cluster." }
        : { tone: "warn", label: "Simulator", title: "Runs from this page go to the simulator: this page isn't connected to a cluster." };

      const approveStep =
        mode === "advisory"
          ? { state: "", sub: "Advisory: nothing is submitted" }
          : mode === "delegation"
          ? { state: "done", sub: `Delegated up to ${eur(ceiling)}` }
          : activePlan && approvedPlanId === activePlan.plan_id
          ? { state: "done", sub: "Approved by you" }
          : { state: value ? "active" : "", sub: "Waiting for your approval" };

      let verifyStep = { state: "", sub: "Nothing submitted yet" };
      if (executionResult) {
        if (submitted) {
          const verified = ourJobVisible ? liveWl.verification_status === "verified" : false;
          verifyStep = {
            state: verified ? "done" : "active",
            sub: `Job ${executionResult.job_id} · ${ourJobVisible ? String(liveWl.status).toLowerCase() : "submitted"}${verified ? " · verified" : ""}`,
          };
        } else {
          verifyStep = { state: "bad", sub: executionResult.status === "blocked" ? "Blocked by governance" : "Submission failed" };
        }
      }

      const steps = [
        { title: "Describe", state: "done", sub: `${cpuRequested} vCPU · ${mins(deadline)} deadline · ${eur(budget)} budget` },
        {
          title: "Compare",
          state: value ? "done" : loadingPlans ? "active" : "",
          sub: value
            ? `${value.plans.length} plans · best ${approxEur(planCost(value.recommended))}`
            : loadingPlans
            ? "Pricing every option…"
            : "Not compared yet",
        },
        { title: "Approve", state: approveStep.state, sub: approveStep.sub },
        { title: "Verify", state: verifyStep.state, sub: verifyStep.sub },
      ];

      const tabIndex = activeTab === "ledger" ? 1 : activeTab === "cluster" ? 2 : 0;

      return (
        <div>
          <header className="topbar">
            <div className="topbar-inner">
              <div className="brand">
                <BrandMark />
                <span>AgentGrid</span>
              </div>
              <nav className="seg" role="tablist" aria-label="Views">
                <span className="seg-thumb" style={{ transform: `translateX(${tabIndex * 100}%)` }} />
                <button id="tab-run" role="tab" aria-selected={activeTab === "run"} onClick={() => setActiveTab("run")}>
                  Run
                </button>
                <button id="tab-ledger" role="tab" aria-selected={activeTab === "ledger"} onClick={() => setActiveTab("ledger")}>
                  Ledger
                </button>
                <button id="tab-cluster" role="tab" aria-selected={activeTab === "cluster"} onClick={() => setActiveTab("cluster")}>
                  Cluster
                </button>
              </nav>
              <div className="top-right">
                <span className="chip" title={runtimeChip.title}>
                  <span className={`dot ${runtimeChip.tone}`} />
                  {runtimeChip.label}
                </span>
                <div className="pop-anchor">
                  <button
                    id="governance-toggle"
                    className="chip"
                    aria-haspopup="dialog"
                    aria-expanded={showGovernance}
                    onClick={() => setShowGovernance(!showGovernance)}
                    title={modeCopy.line}
                  >
                    <Icon name="shield" size={15} />
                    {modeCopy.label}
                    <Icon name="caret" size={14} />
                  </button>
                  {showGovernance && <div className="pop-scrim" onClick={() => setShowGovernance(false)} />}
                  {showGovernance && (
                    <div className="pop" role="dialog" aria-label="Who decides what runs">
                      <div className="pop-h">Who decides what runs</div>
                      <button className="mode-opt" role="radio" aria-checked={mode === "advisory"} onClick={() => applyControlMode("advisory")}>
                        <span className="radio" />
                        <span>
                          <span className="mode-t">Advisory</span>
                          <br />
                          <span className="mode-s">{MODE_COPY.advisory.line}</span>
                        </span>
                      </button>
                      <button className="mode-opt" role="radio" aria-checked={mode === "validation"} onClick={() => applyControlMode("validation")}>
                        <span className="radio" />
                        <span>
                          <span className="mode-t">Validation</span>
                          <br />
                          <span className="mode-s">{MODE_COPY.validation.line}</span>
                        </span>
                      </button>
                      <button className="mode-opt" role="radio" aria-checked={mode === "delegation"} onClick={() => applyControlMode("delegation")}>
                        <span className="radio" />
                        <span>
                          <span className="mode-t">Delegation</span>
                          <br />
                          <span className="mode-s">{MODE_COPY.delegation.line}</span>
                        </span>
                      </button>
                      {controlMode === "delegation" && (
                        <div className="field" style={{ padding: "4px 10px 0" }}>
                          <label htmlFor="ceiling">Spending ceiling for this run</label>
                          <div className="input-wrap">
                            <input
                              id="ceiling"
                              className="input has-suffix"
                              type="number"
                              min="0"
                              step="1"
                              value={delegationBudget}
                              onChange={(e) => setDelegationBudget(e.target.value)}
                              onBlur={() => syncControlMode("delegation", delegationBudget)}
                            />
                            <span className="suffix">EUR</span>
                          </div>
                        </div>
                      )}
                      <div className="pop-foot">
                        {serverControl
                          ? `Enforced by the server for ${serverControl.workload_id}` +
                            (serverControl.control_mode === "delegation"
                              ? ` · ${eur(serverControl.committed_cost_eur)} committed, ${eur(serverControl.remaining_delegated_budget_eur)} left`

                      <span className="mono">COMPUTE_RUNTIME=slurm</span>.

                  </div>

                      <strong>{finops.total_workloads}</strong> {finops.total_workloads === 1 ? "run" : "runs"} so far

                        <span>
                          {" · "}
                          <strong>
                            {finops.reliability_and_governance.sla_compliant_workloads}/
                            {finops.reliability_and_governance.sla_evaluated_workloads}

                      {measuredRuns === 0 ? (
                        <span>none measured yet</span>

                        <span>
                          <strong>{eur(finops.financial_tiers.tier2_verified_usage_total_eur)}</strong> measured spend

                <div className="grid-run">

                    <div className="card-h">

                    <div className="field">
                      <label htmlFor="job-command">Command</label>
                      <input id="job-command" className="input mono" value={command} onChange={(e) => setCommand(e.target.value)} />
                    </div>
                    <div className="row2">
                      <div className="field">
                        <label htmlFor="job-cpu">vCPU</label>
                        <input id="job-cpu" className="input num" type="number" min="1" value={cpuRequested} onChange={(e) => setCpuRequested(e.target.value)} />
                      </div>
                      <div className="field">
                        <label htmlFor="job-mem">Memory</label>
                        <div className="input-wrap">
                          <input id="job-mem" className="input num has-suffix" type="number" min="1" value={memoryGbRequested} onChange={(e) => setMemoryGbRequested(e.target.value)} />
                          <span className="suffix">GB</span>
                        </div>
                      </div>
                    </div>
                    <div className="field">
                      <label htmlFor="job-work">Work on 1 vCPU</label>
                      <div className="input-wrap">
                        <input id="job-work" className="input num has-suffix" type="number" min="1" value={serialMinutes} onChange={(e) => setSerialMinutes(e.target.value)} />

                    </div>

                          <span className="suffix">min</span>
                        </div>
                      </div>
                      <div className="field">
                        <label htmlFor="job-budget">Budget</label>

                          <span className="suffix">EUR</span>

                      </div>

                    <label className="toggle" htmlFor="job-interruptible">

                      <span>
                        <span className="toggle-t">Can be interrupted</span>

                      </span>

                    <button id="compare-plans" className="btn btn-primary btn-block" type="submit" disabled={loadingPlans}>
                      {loadingPlans ? "Comparing plans…" : "Compare plans"}

                  </form>

                    {planError && (
                      <div className="banner bad" role="alert">
                        <Icon name="alert" size={18} />
                        <div>{planError}</div>
                      </div>

                    {!planComparison && loadingPlans && <Skeleton rows={4} />}

                    {!planComparison && !loadingPlans && !planError && (
                      <div className="empty">
                        <h3>Every way to run this job, priced and timed</h3>
                        <p>
                          Compare plans to see what each machine would cost and how long it would take. AgentGrid recommends the
                          cheapest plan that meets your deadline, and nothing runs until you say so.
                        </p>
                      </div>
                    )}

                    {planComparison && !value && (
                      <div className="card pad">
                        <div className="card-h">
                          <h2>No plan fits these constraints</h2>
                          <Tag tone="bad">Nothing to approve</Tag>
                        </div>
                        <p className="reason">{planComparison.unfeasible_explanation || "The planner found no compatible shape."}</p>

                          <ul className="checks">
                            {planComparison.blocking_constraints.map((item, i) => (
                              <li key={i}>
                                <span className="ic" style={{ color: "var(--bad)" }}>
                                  <Icon name="x" size={14} />
                                </span>
                                {typeof item === "string" ? item : JSON.stringify(item)}

                            ))}

                          <div className="basis">Try: {planComparison.suggested_relaxations.join(" · ")}</div>

                      </div>
